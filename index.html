<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8553d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>おでかけ手帳</title>
<style>
:root{--bg:#fbf6ef;--card:#fff;--ink:#2b2420;--sub:#85786d;--acc:#c8553d;--line:#eadfd2}
@media(prefers-color-scheme:dark){:root{--bg:#1c1816;--card:#292321;--ink:#f3ebe3;--sub:#a8998c;--line:#3b332f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:var(--acc);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:18px;margin:0}
header button{background:none;border:0;color:#fff;font-size:14px}
main{padding:16px;max-width:600px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;position:relative}
.card img{width:100%;max-height:220px;object-fit:cover;display:block}
.badge{position:absolute;right:8px;top:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.card .b{padding:12px 14px}
.card h2{font-size:17px;margin:0 0 2px}
.meta{color:var(--sub);font-size:13px}
.tags{margin-top:4px}
.tags span{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:0 4px 4px 0;color:var(--sub)}
.s{font-size:20px;letter-spacing:2px;background:linear-gradient(90deg,#e9a21b var(--p),#cfc6bd var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.empty{text-align:center;color:var(--sub);margin-top:60px}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;box-shadow:0 4px 12px #0004}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0008}
form{padding:16px;display:grid;gap:12px}
label,.lb{font-size:13px;color:var(--sub);display:grid;gap:4px}
input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:4px 10px;background:var(--card)}
.chk input{width:auto}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.btn.p{background:var(--acc);color:#fff;border:0}
.btn.d{color:#c0392b}
#rate{display:flex;align-items:center;gap:8px}
#rate .s{font-size:34px;cursor:pointer;user-select:none}
#rv{color:var(--ink);font-size:16px}
#thumbs{display:flex;gap:8px;flex-wrap:wrap}
#thumbs div{position:relative}
#thumbs img{width:80px;height:80px;object-fit:cover;border-radius:8px}
#thumbs button{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:13px;line-height:1;padding:0}
</style></head><body>
<header><h1>♨ おでかけ手帳</h1><button id="menu">バックアップ</button></header>
<main><input id="q" placeholder="さがす(施設名・場所・メンバー・感想)" style="margin-bottom:14px"><div id="list"></div></main>
<button id="fab" aria-label="追加">＋</button>

<dialog id="edit"><form id="f" method="dialog">
<label>施設名<input name="name" required></label>
<label>日付<input name="date" type="date" required></label>
<div class="row"><label style="flex:1">都道府県<input name="prefecture"></label><label style="flex:2">住所<input name="address"></label></div>
<label>メンバー<input name="members" placeholder="パパ、ママ、たろう"></label>
<div class="lb">評価(星の左半分で0.5、右半分で1.0)<div id="rate"></div></div>
<label>ひとこと感想<textarea name="memo" rows="4"></textarea></label>
<div class="lb">サウナの記録(任意)
<div class="row"><label style="flex:1">サウナ温度(℃)<input name="saunaTemp" type="number" inputmode="numeric"></label><label style="flex:1">水風呂温度(℃)<input name="mizuburoTemp" type="number" inputmode="numeric"></label></div></div>
<div class="chk" id="chk"></div>
<label>写真(何枚でも)<input id="photo" type="file" accept="image/*" multiple></label>
<div id="thumbs"></div>
<div class="row"><button type="button" class="btn" id="cancel">閉じる</button><button type="button" class="btn d" id="del" hidden>削除</button><button class="btn p">保存</button></div>
</form></dialog>

<dialog id="bk"><form method="dialog">
<p style="margin:0">データはこのスマホの中だけに保存されています。家族に渡すときは「書き出し」でファイルを作って送ってください。</p>
<button type="button" class="btn" id="exp">書き出し(ファイルを送る・保存)</button>
<label>読み込み(家族からもらったファイル。今ある記録に追加されます)<input id="imp" type="file" accept=".json,application/json"></label>
<button class="btn">閉じる</button>
</form></dialog>

<script>
const $=s=>document.querySelector(s);
const FLAGS=[['loyly','ロウリュ'],['selfLoyly','セルフロウリュ'],['neppa','熱波'],['sotogaiyoku','外気浴']];
let db,rating=0,photos=[],cur=null;
const req=indexedDB.open('note',1);
req.onupgradeneeded=()=>req.result.createObjectStore('e',{keyPath:'id'});
req.onsuccess=()=>{db=req.result;render()};
const tx=m=>db.transaction('e',m).objectStore('e');
const all=()=>new Promise(r=>{const q=tx('readonly').getAll();q.onsuccess=()=>r(q.result.map(norm))});
const put=o=>new Promise(r=>{const q=tx('readwrite').put(o);q.onsuccess=r});
const rm=id=>new Promise(r=>{const q=tx('readwrite').delete(id);q.onsuccess=r});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 古い形式・他の手帳の形式も受け付けて、今の形式にそろえる
const norm=o=>({...o,name:o.name??o.facility??'',memo:o.memo??o.note??'',members:o.members||'',rating:+o.rating||0,photos:o.photos||(o.photo?[o.photo]:[])});
const star=n=>`<span class="s" style="--p:${n/5*100}%">★★★★★</span>`;

async function render(){
  const k=$('#q').value.trim().toLowerCase();
  let a=(await all()).sort((x,y)=>y.date.localeCompare(x.date));
  if(k)a=a.filter(e=>[e.name,e.prefecture,e.address,e.members,e.memo].join(' ').toLowerCase().includes(k));
  $('#list').innerHTML=a.length?a.map(e=>{
    const tg=[...FLAGS.filter(([f])=>e[f]).map(([,l])=>l),e.saunaTemp?`サウナ ${e.saunaTemp}℃`:'',e.mizuburoTemp?`水風呂 ${e.mizuburoTemp}℃`:''].filter(Boolean);
    return `<div class="card" data-id="${e.id}">${e.photos[0]?`<img src="${e.photos[0]}">`:''}${e.photos.length>1?`<span class="badge">${e.photos.length}枚</span>`:''}<div class="b"><h2>${esc(e.name)}</h2><div>${star(e.rating)} <span class="meta">${e.rating||''}</span></div><div class="meta">${esc(e.date)}${e.members?' ・ '+esc(e.members):''}</div>${e.prefecture||e.address?`<div class="meta">${esc(e.prefecture)} ${esc(e.address)}</div>`:''}${tg.length?`<div class="tags">${tg.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}${e.memo?`<p style="margin:6px 0 0;white-space:pre-wrap">${esc(e.memo)}</p>`:''}</div></div>`}).join(''):'<p class="empty">まだ記録がありません<br>右下の＋から追加しましょう</p>';
}
$('#q').oninput=render;
$('#list').onclick=async e=>{const c=e.target.closest('.card');if(!c)return;open((await all()).find(x=>x.id===c.dataset.id))};

function drawRate(){
  $('#rate').innerHTML=star(rating)+`<span id="rv">${rating||'未評価'}</span>`;
}
$('#rate').onclick=e=>{
  const s=e.target.closest('.s');if(!s)return;
  const r=s.getBoundingClientRect(),v=Math.max(.5,Math.ceil((e.clientX-r.left)/r.width*10)/2);
  rating=rating===v?0:Math.min(5,v);drawRate();
};
function drawThumbs(){
  $('#thumbs').innerHTML=photos.map((p,i)=>`<div><img src="${p}"><button type="button" data-i="${i}">✕</button></div>`).join('');
}
$('#thumbs').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){photos.splice(+i,1);drawThumbs()}};
function open(e){
  cur=e||null;const f=$('#f');f.reset();
  for(const k of ['name','prefecture','address','memo','saunaTemp','mizuburoTemp'])f[k].value=e?.[k]??'';
  f.date.value=e?.date||new Date().toISOString().slice(0,10);
  f.members.value=e?e.members:(localStorage.lastMembers||'');
  $('#chk').innerHTML=FLAGS.map(([k,l])=>`<label><input type="checkbox" name="${k}" ${e?.[k]?'checked':''}>${l}</label>`).join('');
  rating=e?.rating||0;photos=[...(e?.photos||[])];drawRate();drawThumbs();
  $('#del').hidden=!e;$('#edit').showModal();
}
$('#fab').onclick=()=>open();
$('#cancel').onclick=()=>$('#edit').close();
const shrink=file=>new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.75))};
  img.src=URL.createObjectURL(file);
});
$('#photo').onchange=async e=>{
  for(const f of e.target.files)photos.push(await shrink(f));
  e.target.value='';drawThumbs();
};
$('#f').onsubmit=async()=>{
  const f=$('#f');localStorage.lastMembers=f.members.value;
  const o={...(cur||{}),id:cur?.id||crypto.randomUUID(),name:f.name.value,date:f.date.value,prefecture:f.prefecture.value,address:f.address.value,members:f.members.value,memo:f.memo.value,rating,photos,
    saunaTemp:f.saunaTemp.value?+f.saunaTemp.value:'',mizuburoTemp:f.mizuburoTemp.value?+f.mizuburoTemp.value:'',updatedAt:Date.now()};
  for(const [k] of FLAGS)o[k]=f[k].checked;
  delete o.photo;delete o.facility;delete o.note;
  await put(o);render();
};
$('#del').onclick=async()=>{if(confirm('この記録を削除しますか?')){await rm(cur.id);$('#edit').close();render()}};

$('#menu').onclick=()=>$('#bk').showModal();
$('#exp').onclick=async()=>{
  const blob=new Blob([JSON.stringify(await all())],{type:'application/json'});
  const file=new File([blob],'odekake-note.json',{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
};
$('#imp').onchange=async e=>{
  try{const list=JSON.parse(await e.target.files[0].text());let n=0;
    for(const o of list){const x=norm(o);if(x.id&&x.name&&x.date){delete x.photo;delete x.facility;delete x.note;await put(x);n++}}
    alert(n+'件を読み込みました');render();$('#bk').close();
  }catch{alert('読み込めないファイルです')}
  e.target.value='';
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
