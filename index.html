<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6e4a29">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<title>おでかけ手帳</title>
<style>
:root{
  --bg:#6e4a29;--grain-hi:rgba(255,224,175,.08);--grain-lo:rgba(30,16,5,.14);--seam:rgba(20,10,3,.30);
  --surface:#faf3e2;--surface-2:#f1e6ce;--ink:#2a2118;--ink-soft:#74604a;--ink-faint:#a6906e;--rule:#ddcda6;
  --heat:#c1440e;--heat-ink:#fff;--heat-soft:#f2dbc9;--heat-soft-ink:#8a3a12;
  --cool:#234a63;--cool-soft:#d8e3ea;--cool-soft-ink:#1c3a4f;--danger:#a3352b;
  --waku:#f6ead0;--waku-soft:#dcc79a;--wood-lt:#a9793f;--wood-dk:#5c3c22;--wood-ink:#3a2410;
  --stone-lt:#8a877c;--stone-dk:#4e4c44;
  --shadow:0 1px 0 rgba(20,10,3,.14),0 10px 22px -14px rgba(20,10,3,.55);color-scheme:light}
@media(prefers-color-scheme:dark){:root{
  --bg:#170f09;--grain-hi:rgba(255,214,150,.05);--grain-lo:rgba(0,0,0,.32);--seam:rgba(0,0,0,.48);
  --surface:#241a10;--surface-2:#2c2013;--ink:#ecdfc3;--ink-soft:#b7a488;--ink-faint:#8a7455;--rule:#3c2e1c;
  --heat:#e2793f;--heat-ink:#241207;--heat-soft:#3c2a1c;--heat-soft-ink:#f0b98a;
  --cool:#75aecb;--cool-soft:#1d2e3a;--cool-soft-ink:#aed6ec;--danger:#e2705f;--stone-dk:#302f2a;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  padding:calc(24px + env(safe-area-inset-top)) 16px 96px;
  background:
    repeating-linear-gradient(180deg,var(--grain-hi) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(180deg,var(--grain-lo) 0 1px,transparent 1px 9px),
    repeating-linear-gradient(180deg,var(--seam) 0 2px,transparent 2px 88px),
    radial-gradient(ellipse 42px 14px at 12% 18%,rgba(20,10,3,.2),transparent 72%),
    radial-gradient(ellipse 30px 11px at 82% 46%,rgba(20,10,3,.16),transparent 72%),
    radial-gradient(ellipse 36px 13px at 58% 76%,rgba(20,10,3,.14),transparent 72%),
    var(--bg);background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto}
/* 木の看板ヘッダー */
header.cover{position:relative;display:flex;align-items:center;gap:18px;padding:20px 22px;overflow:hidden;
  background:repeating-linear-gradient(180deg,rgba(255,224,175,.10) 0 2px,transparent 2px 6px),
    repeating-linear-gradient(180deg,rgba(20,10,3,.22) 0 1px,transparent 1px 10px),
    linear-gradient(155deg,var(--wood-lt),var(--wood-dk));
  border:1px solid rgba(20,10,3,.4);border-radius:14px;box-shadow:var(--shadow)}
.steam{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.steam span{position:absolute;bottom:-20px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);filter:blur(3px);animation:rise 6s ease-in infinite;opacity:0}
.steam span:nth-child(1){left:8%}
.steam span:nth-child(2){left:16%;width:24px;height:24px;animation-delay:1.4s}
.steam span:nth-child(3){left:24%;width:28px;height:28px;animation-delay:2.8s}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}12%{opacity:.9}70%{opacity:.35}100%{transform:translateY(-92px) translateX(6px) scale(1.3);opacity:0}}
.stove{position:absolute;right:14px;bottom:10px;width:70px;height:56px;pointer-events:none}
.stove svg{display:block;overflow:visible}
.loyly{position:absolute;inset:0}
.loyly span{position:absolute;bottom:26px;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 72%);filter:blur(2px);animation:puff 3.2s ease-out infinite;opacity:0}
.loyly span:nth-child(1){left:18px;animation-delay:.2s}
.loyly span:nth-child(2){left:32px;width:12px;height:12px;animation-delay:1.3s}
.loyly span:nth-child(3){left:44px;width:14px;height:14px;animation-delay:2.3s}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.85}55%{opacity:.4}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.steam span,.loyly span{animation:none;opacity:0}}
.seal{position:relative;z-index:1;flex:none;width:56px;height:66px;padding-top:10px;border-radius:9px 9px 13px 13px;
  background:repeating-linear-gradient(180deg,rgba(255,224,175,.14) 0 2px,transparent 2px 5px),linear-gradient(165deg,var(--wood-lt),var(--wood-dk));
  color:var(--wood-ink);display:flex;align-items:center;justify-content:center;font-family:"Yuji Syuku",serif;font-size:27px;
  text-shadow:0 1px 0 rgba(255,235,205,.3);box-shadow:inset 0 0 0 1px rgba(255,235,205,.18),0 3px 8px -3px rgba(0,0,0,.45)}
.seal::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--wood-dk);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.headtext{position:relative;z-index:1;color:var(--waku);max-width:190px}
.headtext h1{font-family:"Yuji Syuku",serif;font-weight:400;font-size:25px;white-space:nowrap;margin:0 0 3px;letter-spacing:.03em}
.headtext p{margin:0;font-size:12px;color:var(--waku-soft);line-height:1.5}
/* のれん */
.noren{display:flex;justify-content:center;gap:8px;max-width:220px;margin:-8px auto 16px;position:relative;z-index:0}
.noren span{flex:1;height:16px;background:var(--cool);opacity:.9;
  -webkit-mask-image:radial-gradient(circle at 8px 0,transparent 8px,black 8.5px);mask-image:radial-gradient(circle at 8px 0,transparent 8px,black 8.5px);
  -webkit-mask-size:16px 16px;mask-size:16px 16px;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-position:center top;mask-position:center top}
.bar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.bar button{flex:none;font:inherit;font-size:13px;font-weight:700;padding:9px 14px;border-radius:9px;color:var(--waku);cursor:pointer;
  border:1px solid rgba(20,10,3,.4);background:linear-gradient(165deg,var(--wood-lt),var(--wood-dk));box-shadow:var(--shadow)}
input,textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--ink);width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--cool);outline-offset:1px}
#q{flex:1}
/* カード */
#list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative;cursor:pointer}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.pcount{position:absolute;right:10px;top:10px;background:rgba(20,10,3,.65);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.inner{padding:14px;display:flex;gap:14px}
.badge{flex:none;position:relative;overflow:hidden;width:52px;height:62px;padding-top:7px;border-radius:5px 5px 2px 2px;text-align:center;
  background:repeating-linear-gradient(180deg,rgba(255,224,175,.16) 0 2px,transparent 2px 6px),linear-gradient(172deg,var(--wood-lt),var(--wood-dk));
  box-shadow:inset 0 0 0 1px rgba(255,235,205,.16),0 3px 8px -3px rgba(0,0,0,.4);color:var(--wood-ink)}
.badge small{display:block;font-size:10px;font-weight:700;line-height:1.1}
.badge b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.badge i{position:absolute;bottom:0;width:4px;height:30%;background:var(--surface);border-radius:2px 2px 0 0;transform:translateX(-50%)}
.body{min-width:0;flex:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3{font-family:"Zen Old Mincho",serif;font-size:16.5px;font-weight:700;margin:0;word-break:break-word}
.card time{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
.meta{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--rule)}
.tag.heat{background:var(--heat-soft);color:var(--heat-soft-ink);border-color:transparent}
.tag.cool{background:var(--cool-soft);color:var(--cool-soft-ink);border-color:transparent}
.note{margin:8px 0 0;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.s{font-size:18px;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,var(--heat) var(--p),var(--rule) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.rv{font-size:12px;font-weight:700;color:var(--ink-soft);margin-left:4px}
.empty{text-align:center;color:#ecdfc3;font-size:13px;padding:40px 20px;border:1px dashed rgba(255,236,200,.4);border-radius:14px}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;
  background:var(--heat);color:var(--heat-ink);font-size:32px;box-shadow:0 4px 12px #0006;cursor:pointer}
/* ダイアログ */
dialog{border:1px solid var(--rule);border-radius:16px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(20,10,3,.6)}
form{padding:18px;display:grid;gap:14px}
form h2{font-family:"Zen Old Mincho",serif;font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
form h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cool)}
label,.lb{font-size:12px;color:var(--ink-soft);font-weight:700;display:grid;gap:6px}
input[type=file]{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px dashed var(--rule)}
.row{display:flex;gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:var(--surface-2)}
.chk input{width:16px;height:16px;padding:0;accent-color:var(--heat)}
.btn{flex:1;padding:12px;border-radius:9px;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--heat);color:var(--heat-ink);border:0}
.btn.d{color:var(--danger)}
#rate{display:flex;align-items:center;gap:10px}
#rate .s{font-size:34px;cursor:pointer;user-select:none}
#rv{color:var(--ink);font-size:16px;font-weight:700}
#thumbs{display:flex;gap:10px;flex-wrap:wrap}
#thumbs div{position:relative}
#thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--rule)}
#thumbs button{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--danger);color:#fff;font-size:12px;line-height:1;padding:0}
</style></head><body>
<div class="wrap">
<header class="cover">
  <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="stove" aria-hidden="true">
    <svg viewBox="0 0 70 56"><rect x="14" y="34" width="42" height="16" rx="3" fill="#241a12"/><rect x="14" y="34" width="42" height="4" rx="2" fill="#3a2a1a"/>
    <ellipse cx="26" cy="30" rx="9" ry="6.5" fill="#8a877c"/><ellipse cx="26" cy="30" rx="9" ry="6.5" fill="#4e4c44" opacity=".35"/>
    <ellipse cx="40" cy="32" rx="10" ry="7" fill="#8a877c"/><ellipse cx="40" cy="32" rx="10" ry="7" fill="#4e4c44" opacity=".3"/>
    <ellipse cx="52" cy="30" rx="8" ry="6" fill="#8a877c"/><ellipse cx="52" cy="30" rx="8" ry="6" fill="#4e4c44" opacity=".35"/>
    <ellipse cx="33" cy="23" rx="7" ry="5" fill="#8a877c"/><ellipse cx="33" cy="23" rx="7" ry="5" fill="#4e4c44" opacity=".3"/></svg>
    <div class="loyly"><span></span><span></span><span></span></div>
  </div>
  <div class="seal">出</div>
  <div class="headtext"><h1>おでかけ手帳</h1><p>家族で行った場所を、ひとつずつ書きためていく記録帳。</p></div>
</header>
<div class="noren" aria-hidden="true"><span></span><span></span></div>
<div class="bar"><input id="q" placeholder="さがす(施設名・場所・メンバー・感想)"><button id="menu">バックアップ</button></div>
<div id="list"></div>
</div>
<button id="fab" aria-label="追加">＋</button>
<dialog id="edit"><form id="f" method="dialog">
<h2 id="ft">記録を書く</h2>
<label>施設名<input name="name" required></label>
<label>日付<input name="date" type="date" required></label>
<div class="row"><label style="flex:1">都道府県<input name="prefecture"></label><label style="flex:2">住所<input name="address"></label></div>
<label>メンバー<input name="members" placeholder="パパ、ママ、たろう"></label>
<div class="lb">評価(星の左半分で0.5、右半分で1.0)<div id="rate"></div></div>
<label>ひとこと感想<textarea name="memo" rows="4"></textarea></label>
<div class="lb">サウナの記録(任意)
<div class="row"><label style="flex:1">サウナ温度(℃)<input name="saunaTemp" type="number" inputmode="numeric"></label><label style="flex:1">水風呂温度(℃)<input name="mizuburoTemp" type="number" inputmode="numeric"></label></div></div>
<div class="chk" id="chk"></div>
<label>写真(何枚でも)<input id="photo" type="file" accept="image/*" multiple></label>
<div id="thumbs"></div>
<div class="row"><button type="button" class="btn" id="cancel">閉じる</button><button type="button" class="btn d" id="del" hidden>削除</button><button class="btn p">保存</button></div>
</form></dialog>

<dialog id="bk"><form method="dialog">
<p style="margin:0">データはこのスマホの中だけに保存されています。家族に渡すときは「書き出し」でファイルを作って送ってください。</p>
<button type="button" class="btn" id="exp">書き出し(ファイルを送る・保存)</button>
<label>読み込み(家族からもらったファイル。今ある記録に追加されます)<input id="imp" type="file" accept=".json,application/json"></label>
<button class="btn">閉じる</button>
</form></dialog>

<script>
const $=s=>document.querySelector(s);
const FLAGS=[['loyly','ロウリュ'],['selfLoyly','セルフロウリュ'],['neppa','熱波'],['sotogaiyoku','外気浴']];
let db,rating=0,photos=[],cur=null;
const req=indexedDB.open('note',1);
req.onupgradeneeded=()=>req.result.createObjectStore('e',{keyPath:'id'});
req.onsuccess=()=>{db=req.result;render()};
const tx=m=>db.transaction('e',m).objectStore('e');
const all=()=>new Promise(r=>{const q=tx('readonly').getAll();q.onsuccess=()=>r(q.result.map(norm))});
const put=o=>new Promise(r=>{const q=tx('readwrite').put(o);q.onsuccess=r});
const rm=id=>new Promise(r=>{const q=tx('readwrite').delete(id);q.onsuccess=r});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 古い形式・他の手帳の形式も受け付けて、今の形式にそろえる
const norm=o=>({...o,name:o.name??o.facility??'',memo:o.memo??o.note??'',members:o.members||'',rating:+o.rating||0,photos:o.photos||(o.photo?[o.photo]:[])});
const star=n=>`<span class="s" style="--p:${n/5*100}%">★★★★★</span>`;

async function render(){
  const k=$('#q').value.trim().toLowerCase();
  const every=(await all()).sort((x,y)=>x.date.localeCompare(y.date));
  const no=new Map(every.map((e,i)=>[e.id,i+1]));
  let a=every.slice().reverse();
  if(k)a=a.filter(e=>[e.name,e.prefecture,e.address,e.members,e.memo].join(' ').toLowerCase().includes(k));
  $('#list').innerHTML=a.length?a.map(e=>{
    const d=e.date.split('-');
    const tags=[...FLAGS.filter(([f])=>e[f]).map(([,l])=>`<span class="tag heat">${l}</span>`),
      e.saunaTemp?`<span class="tag heat">サウナ ${esc(e.saunaTemp)}℃</span>`:'',
      e.mizuburoTemp?`<span class="tag cool">水風呂 ${esc(e.mizuburoTemp)}℃</span>`:'',
      e.prefecture?`<span class="tag">${esc(e.prefecture)}</span>`:''].join('');
    return `<div class="card" data-id="${e.id}">${e.photos[0]?`<img src="${e.photos[0]}" alt="">`:''}${e.photos.length>1?`<span class="pcount">${e.photos.length}枚</span>`:''}
<div class="inner"><div class="badge"><small>${d[0]}</small><b>${no.get(e.id)}</b><i style="left:23%"></i><i style="left:50%"></i><i style="left:77%"></i></div>
<div class="body"><div class="top"><h3>${esc(e.name)}</h3><time>${esc(e.date)}</time></div>
<div style="margin-top:4px">${star(e.rating)}<span class="rv">${e.rating||''}</span></div>
${e.address||e.members?`<div class="meta">${esc(e.address)}${e.address&&e.members?' ・ ':''}${esc(e.members)}</div>`:''}
${tags?`<div class="tags">${tags}</div>`:''}${e.memo?`<p class="note">${esc(e.memo)}</p>`:''}</div></div></div>`}).join(''):'<p class="empty">まだ記録がありません。<br>右下の＋から書き始めましょう。</p>';
}
$('#q').oninput=render;
$('#list').onclick=async e=>{const c=e.target.closest('.card');if(!c)return;open((await all()).find(x=>x.id===c.dataset.id))};

function drawRate(){
  $('#rate').innerHTML=star(rating)+`<span id="rv">${rating||'未評価'}</span>`;
}
$('#rate').onclick=e=>{
  const s=e.target.closest('.s');if(!s)return;
  const r=s.getBoundingClientRect(),v=Math.max(.5,Math.ceil((e.clientX-r.left)/r.width*10)/2);
  rating=rating===v?0:Math.min(5,v);drawRate();
};
function drawThumbs(){
  $('#thumbs').innerHTML=photos.map((p,i)=>`<div><img src="${p}"><button type="button" data-i="${i}">✕</button></div>`).join('');
}
$('#thumbs').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){photos.splice(+i,1);drawThumbs()}};
function open(e){
  cur=e||null;const f=$('#f');f.reset();
  for(const k of ['name','prefecture','address','memo','saunaTemp','mizuburoTemp'])f[k].value=e?.[k]??'';
  f.date.value=e?.date||new Date().toISOString().slice(0,10);
  f.members.value=e?e.members:(localStorage.lastMembers||'');
  $('#chk').innerHTML=FLAGS.map(([k,l])=>`<label><input type="checkbox" name="${k}" ${e?.[k]?'checked':''}>${l}</label>`).join('');
  rating=e?.rating||0;photos=[...(e?.photos||[])];drawRate();drawThumbs();
  $('#del').hidden=!e;$('#ft').textContent=e?'記録を直す':'記録を書く';$('#edit').showModal();
}
$('#fab').onclick=()=>open();
$('#cancel').onclick=()=>$('#edit').close();
const shrink=file=>new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.75))};
  img.src=URL.createObjectURL(file);
});
$('#photo').onchange=async e=>{
  for(const f of e.target.files)photos.push(await shrink(f));
  e.target.value='';drawThumbs();
};
$('#f').onsubmit=async()=>{
  const f=$('#f');localStorage.lastMembers=f.members.value;
  const o={...(cur||{}),id:cur?.id||crypto.randomUUID(),name:f.name.value,date:f.date.value,prefecture:f.prefecture.value,address:f.address.value,members:f.members.value,memo:f.memo.value,rating,photos,
    saunaTemp:f.saunaTemp.value?+f.saunaTemp.value:'',mizuburoTemp:f.mizuburoTemp.value?+f.mizuburoTemp.value:'',updatedAt:Date.now()};
  for(const [k] of FLAGS)o[k]=f[k].checked;
  delete o.photo;delete o.facility;delete o.note;
  await put(o);render();
};
$('#del').onclick=async()=>{if(confirm('この記録を削除しますか?')){await rm(cur.id);$('#edit').close();render()}};

$('#menu').onclick=()=>$('#bk').showModal();
$('#exp').onclick=async()=>{
  const blob=new Blob([JSON.stringify(await all())],{type:'application/json'});
  const file=new File([blob],'odekake-note.json',{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
};
$('#imp').onchange=async e=>{
  try{const list=JSON.parse(await e.target.files[0].text());let n=0;
    for(const o of list){const x=norm(o);if(x.id&&x.name&&x.date){delete x.photo;delete x.facility;delete x.note;await put(x);n++}}
    alert(n+'件を読み込みました');render();$('#bk').close();
  }catch{alert('読み込めないファイルです')}
  e.target.value='';
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
